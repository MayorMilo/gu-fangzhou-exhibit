<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Gu Fangzhou Exhibit</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="stage" id="stage">
  <header class="topbar">
    <a id="home" class="eyebrow" href="index.html">← Gu Fangzhou</a>
    <span><span class="eyebrow" id="dates"></span> &nbsp;·&nbsp; <a class="eyebrow" id="cites" href="citations.html">Citations</a></span>
  </header>
  <p class="heading" id="heading"></p>
  <div class="axis"></div>
  <div class="track" id="track"></div>
  <div class="spot"></div>
  <div class="bigyear" id="bigYear"></div>
  <div class="leave-hint" id="leaveHint">Scroll up again to return to the title</div>
  <article class="info" id="info" aria-live="polite">
    <div class="inner">
      <h2 id="iTitle"></h2>
      <p class="body" id="iBody"></p>
      <p class="cap" id="iCap"></p>
      <p class="src" id="iSrc"></p>
      <p class="draft" id="iDraft" hidden>Unverified draft</p>
      <a class="back" id="iBack" href="index.html" hidden>Back to start</a>
    </div>
  </article>
  <footer class="hud">
    <span class="count" id="count"></span>
    <div class="bar"><i id="prog"></i></div>
    <div class="nav"><button id="prev" aria-label="Previous card">←</button><button id="next" aria-label="Next card">→</button></div>
  </footer>
</div>
<script src="js/content.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/timeline.js?v=3"></script>
</body>
</html>
